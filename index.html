<style>
  :root{
    --bg:#EEF0E7;
    --card:#FBFAF4;
    --ink:#202B22;
    --ink-soft:#5B6B5C;
    --line:#D6D9C6;
    --coral:#D1512D;
    --habit:#4E7A8C;
    --idea:#B98B2E;
    --remind:#7A6C93;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(32,43,34,0.05) 1px, transparent 0);
    background-size: 22px 22px;
    color:var(--ink);
    font-family: Tahoma, 'Segoe UI', Arial, sans-serif;
    min-height:100vh;
    padding: 28px 20px 60px;
  }
  .wrap{ max-width: 1180px; margin: 0 auto; }

  header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap: 16px;
    padding-bottom: 18px;
    margin-bottom: 26px;
    border-bottom: 2px solid var(--ink);
    flex-wrap: wrap;
  }
  header .titles h1{
    font-size: clamp(26px, 4vw, 38px);
    font-weight: 800;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  header .titles p{
    margin:0;
    color: var(--ink-soft);
    font-size: 14.5px;
    font-weight: 500;
  }
  .overall{
    text-align:left;
    font-size: 13.5px;
    color: var(--ink-soft);
    font-weight: 600;
    white-space: nowrap;
  }
  .overall b{
    color: var(--coral);
    font-size: 20px;
    font-weight: 800;
  }

  /* ---------- ideas ---------- */
  .ideas{
    background: var(--card);
    border:1px solid var(--line);
    border-radius:6px;

<body>
<div class="wrap">
  <header>
    <div class="titles">
      <h1>برنامه هفتگی</h1>
      <p>کارهای هر روز رو بنویس و همون‌طور که پیش می‌ری، تیک بزن</p>
    </div>
    <div class="overall" id="overall">در حال بارگذاری…</div>
  </header>

  <div id="installBar">
    <span id="installMsg">این صفحه رو به هوم‌اسکرین گوشیت اضافه کن تا مثل یه اپ جدا بازش کنی</span>
    <button id="installBtn" type="button">نصب</button>
    <button class="close" id="installClose" type="button" aria-label="بستن">×</button>
  </div>

  <div id="root">
    <div class="loading">در حال بارگذاری برنامه…</div>
  </div>

  <div id="toastStack"></div>

  <footer>
    <span>تغییرات به‌صورت خودکار ذخیره می‌شن</span>
    <button id="resetBtn" type="button">پاک کردن همه</button>
  </footer>
</div>

<script>
const DAYS = [
  { key:'sat', name:'شنبه',      short:'ش',  color:'#6B8F71' },
  { key:'sun', name:'یک‌شنبه',    short:'ی',  color:'#B98B2E' },
  { key:'mon', name:'دوشنبه',    short:'د',  color:'#7A6C93' },
  { key:'tue', name:'سه‌شنبه',    short:'س',  color:'#4E7A8C' },
  { key:'wed', name:'چهارشنبه',  short:'چ',  color:'#C1663A' },
  { key:'thu', name:'پنجشنبه',   short:'پ',  color:'#8A9A5B' },
  { key:'fri', name:'جمعه',      short:'ج',  color:'#D1512D' },
];
const STORAGE_KEY = 'weekly-plan-v1';

let state = null;
// state = { days: { sat:[{id,text,done}], ... }, habits: [{id,text}], habitDone: { habitId: { sat:true,... } } }

function emptyDays(){
  const s = {};
  DAYS.forEach(d => s[d.key] = []);
  return s;
}
function emptyState(){
  return { days: emptyDays(), habits: [], habitDone: {}, ideas: [], reminders: [] };
}

function uid(prefix){
  return (prefix||'t') + Math.random().toString(36).slice(2,10);
}

function migrate(parsed){
  if(!parsed) return emptyState();
  if(parsed.days && parsed.habits){
    // ensure all day keys exist
    DAYS.forEach(d => { if(!parsed.days[d.key]) parsed.days[d.key] = []; });
    if(!parsed.habitDone) parsed.habitDone = {};
    if(!Array.isArray(parsed.ideas)) parsed.ideas = [];
    parsed.ideas.forEach(i => {
      if(typeof i.rating !== 'number'){
        i.rating = (i.starred === true) ? 5 : 0; // migrate old boolean star
      }
      delete i.starred;
      if(typeof i.note !== 'string') i.note = '';
      if(typeof i.category !== 'string') i.category = '';
    });
    if(!Array.isArray(parsed.reminders)) parsed.reminders = [];
    parsed.reminders.forEach(r => {
      if(typeof r.status !== 'string') r.status = 'active';
      if(typeof r.priority !== 'string') r.priority = 'medium';
      if(typeof r.dayLink !== 'string') r.dayLink = '';
      if(typeof r.lastFiredKey !== 'string') r.lastFiredKey = '';
    });
    return parsed;
  }
  // old flat format: { sat:[...], sun:[...], ... }
  const days = emptyDays();
  DAYS.forEach(d => { if(Array.isArray(parsed[d.key])) days[d.key] = parsed[d.key]; });
  return { days, habits: [], habitDone: {}, ideas: [], reminders: [] };
}

async function load(){
  try{
    const raw = window.localStorage.getItem(STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : null;
    state = migrate(parsed);
  }catch(e){
    state = emptyState();
  }
  state.ideas.forEach(i => { if(i.note && i.note.trim() !== '') expandedNotes.add(i.id); });
  render();
  checkReminders();
  setInterval(checkReminders, 20000);
}

async function save(){
  try{
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    console.error('ذخیره‌سازی ناموفق بود', e);
  }
}

/* ---- day tasks ---- */
function addTask(dayKey, text){
  const trimmed = text.trim();
  if(!trimmed) return;
  state.days[dayKey].push({ id: uid('t'), text: trimmed, done:false });
  save(); render();
}
function toggleTask(dayKey, id){

  if(t){ t.done = !t.done; save(); render(); }
}
function deleteTask(dayKey, id){

  save(); render();
}
function editTask(dayKey, id, newText){
  const t = state.days[dayKey].find(t => t.id === id);
  if(!t) return;
  const trimmed = newText.trim();
  if(!trimmed){ deleteTask(dayKey, id); return; }
  t.text = trimmed;
  save();
}

function toggleHabit(id, dayKey){
  if(!state.habitDone[id]) state.habitDone[id] = {};
  state.habitDone[id][dayKey] = !state.habitDone[id][dayKey];
  save(); render();
}

function computeOverall(){
  let total = 0, done = 0;
  DAYS.forEach(d => {
    state.days[d.key].forEach(t => { total++; if(t.done) done++; });
  });
  state.habits.forEach(h => {
    DAYS.forEach(d => {
      total++;
      if(state.habitDone[h.id] && state.habitDone[h.id][d.key]) done++;
    });
  });
  return { total, done };
}

const CATEGORY_PALETTE = ['#6B8F71','#B98B2E','#7A6C93','#4E7A8C','#C1663A','#8A9A5B','#D1512D'];
function categoryColor(name){
  if(!name) return '#8C9488';
  let h = 0;
  for(let i=0;i<name.length;i++) h = (h*31 + name.charCodeAt(i)) >>> 0;
  return CATEGORY_PALETTE[h % CATEGORY_PALETTE.length];
}

/* ---- reminders ---- */
const PRIORITIES = {
  low:    { label:'کم',     color:'#8A9A5B' },
  medium: { label:'متوسط',  color:'#B98B2E' },
  high:   { label:'زیاد',   color:'#D1512D' },
};
let remFormOpen = false;
let remArchiveOpen = false;

function pad2(n){ return String(n).padStart(2,'0'); }
function todayISO(){
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}
function jsWeekdayToKey(jsDay){
  const map = {6:'sat',0:'sun',1:'mon',2:'tue',3:'wed',4:'thu',5:'fri'};
  return map[jsDay];
}

function addReminder(data){
  const text = data.text.trim();
  if(!text || !data.time) return;
  if(data.mode === 'once' && !data.date) return;
  if(data.mode === 'weekly' && !data.weekday) return;
  state.reminders.push({
    id: uid('r'),
    text,
    mode: data.mode,          // 'once' | 'daily' | 'weekly'
    date: data.date || '',
    time: data.time,
    weekday: data.weekday || '',
    dayLink: data.dayLink || '',
    priority: data.priority || 'medium',
    status: 'active',
    lastFiredKey: ''
  });
  save(); render();
  requestNotifPermission();
}
function deleteReminder(id){
  state.reminders = state.reminders.filter(r => r.id !== id);
  save(); render();
}
function setReminderStatus(id, status){
  const r = state.reminders.find(r => r.id === id);
  if(!r) return;
  r.status = status;
  save(); render();
}
function editReminderText(id, newText){
  const r = state.reminders.find(r => r.id === id);
  if(!r) return;
  const trimmed = newText.trim();
  if(!trimmed){ deleteReminder(id); return; }
  r.text = trimmed;
  save();
}
function convertReminderToTask(id){
  const r = state.reminders.find(r => r.id === id);
  if(!r) return;
  const targetDay = r.dayLink || jsWeekdayToKey(new Date().getDay());
  addTask(targetDay, r.text);
  setReminderStatus(id, 'done');
}

function reminderMeta(r){
  if(r.mode === 'once'){
    const overdue = r.status === 'active' && new Date(`${r.date}T${r.time}`) < new Date();
    return { label: `${r.date} — ساعت ${r.time}`, overdue };
  }
  if(r.mode === 'daily'){
    return { label: `هر روز — ساعت ${r.time}`, overdue:false };
  }
  const dayObj = DAYS.find(d => d.key === r.weekday);
  return { label: `هر هفته ${dayObj ? dayObj.name : ''} — ساعت ${r.time}`, overdue:false };
}

function playBeep(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880;
    g.gain.value = 0.16;
    o.start();
    setTimeout(() => { o.stop(); ctx.close(); }, 220);
  }catch(e){}
}

function requestNotifPermission(){
  try{
    if('Notification' in window && Notification.permission === 'default'){
      Notification.requestPermission();
    }
  }catch(e){}
}

function showToast(text){
  const stack = document.getElementById('toastStack');
  if(!stack) return;
  const toast = document.createElement('div');
  toast.className = 'toast';
  const span = document.createElement('span');
  span.textContent = '⏰ ' + text;
  const close = document.createElement('button');
  close.className = 'close';
  close.type = 'button';
  close.textContent = '×';
  close.addEventListener('click', () => toast.remove());
  toast.appendChild(span);
  toast.appendChild(close);
  stack.appendChild(toast);
  setTimeout(() => toast.remove(), 8000);
}

function fireReminder(r){
  showToast(r.text);
  playBeep();
  try{
    if('Notification' in window && Notification.permission === 'granted'){
      new Notification('یادآوری: ' + r.text);
    }
  }catch(e){}
}

function checkReminders(){
  if(!state || !state.reminders) return;
  const now = new Date();
  const today = todayISO();
  let changed = false;

  state.reminders.forEach(r => {
    if(r.status !== 'active') return;

    if(r.mode === 'once'){
      const due = new Date(`${r.date}T${r.time}`);
      const key = `${r.date}T${r.time}`;
      if(now >= due && r.lastFiredKey !== key){
        fireReminder(r);
        r.lastFiredKey = key;
        changed = true;
      }
    } else if(r.mode === 'daily'){
      const due = new Date(`${today}T${r.time}`);
      const key = `${today}T${r.time}`;
      if(now >= due && r.lastFiredKey !== key){
        fireReminder(r);
        r.lastFiredKey = key;
        changed = true;
      }
    } else if(r.mode === 'weekly'){
      const todayKey = jsWeekdayToKey(now.getDay());
      if(todayKey === r.weekday){
        const due = new Date(`${today}T${r.time}`);
        const key = `${today}T${r.time}`;
        if(now >= due && r.lastFiredKey !== key){
          fireReminder(r);
          r.lastFiredKey = key;
          changed = true;
        }
      }
    }
  });

  if(changed){ save(); render(); }
}

    box.appendChild(buildReminderForm());
  }

  const all = state.reminders;

  active.sort((a,b) => a.time.localeCompare(b.time));

    empty.className = 'rem-empty';

}

function buildReminderList(items, isOverdueGroup){
  const list = document.createElement('div');
  list.className = 'rem-list';

  items.forEach(r => {
    const meta = reminderMeta(r);
    const item = document.createElement('div');
    item.className = 'rem-item' + (r.status === 'done' ? ' done' : '') + (isOverdueGroup ? ' overdue' : '');

    const prio = document.createElement('div');
    prio.className = 'prio';
    prio.style.background = PRIORITIES[r.priority] ? PRIORITIES[r.priority].color : '#999';
    prio.title = PRIORITIES[r.priority] ? PRIORITIES[r.priority].label : '';

    const body = document.createElement('div');
    body.className = 'body';

    const txt = document.createElement('div');
    txt.className = 'txt';
    txt.contentEditable = 'true';
    txt.textContent = r.text;
    txt.addEventListener('blur', () => editReminderText(r.id, txt.textContent));
    txt.addEventListener('keydown', (e) => { if(e.key === 'Enter'){ e.preventDefault(); txt.blur(); } });

    const metaRow = document.createElement('div');
    metaRow.className = 'meta';
    const timeSpan = document.createElement('span');
    timeSpan.textContent = meta.label;
    metaRow.appendChild(timeSpan);
    if(r.dayLink){
      const dObj = DAYS.find(d => d.key === r.dayLink);
      if(dObj){
        const tag = document.createElement('span');
        tag.className = 'daytag';
        tag.style.setProperty('--tc', dObj.color);
        tag.textContent = dObj.name;
        metaRow.appendChild(tag);
      }
    }
    if(r.status !== 'active'){
      const statusSpan = document.createElement('span');
      statusSpan.textContent = r.status === 'done' ? '(انجام‌شده)' : '(لغوشده)';
      metaRow.appendChild(statusSpan);
    }

    body.appendChild(txt);
    body.appendChild(metaRow);

    const btns = document.createElement('div');
    btns.className = 'btns';

    if(r.status === 'active'){
      const toTask = document.createElement('button');
      toTask.type = 'button';
      toTask.textContent = 'تبدیل به تسک';
      toTask.addEventListener('click', () => convertReminderToTask(r.id));

      const doneBtn = document.createElement('button');
      doneBtn.type = 'button';
      doneBtn.textContent = 'انجام‌شد';
      doneBtn.addEventListener('click', () => setReminderStatus(r.id, 'done'));

      const cancelBtn = document.createElement('button');
      cancelBtn.type = 'button';
      cancelBtn.className = 'danger';
      cancelBtn.textContent = 'لغو';
      cancelBtn.addEventListener('click', () => setReminderStatus(r.id, 'cancelled'));

      btns.appendChild(toTask);
      btns.appendChild(doneBtn);
      btns.appendChild(cancelBtn);
    } else {
      const restoreBtn = document.createElement('button');
      restoreBtn.type = 'button';
      restoreBtn.textContent = 'بازگردانی';
      restoreBtn.addEventListener('click', () => setReminderStatus(r.id, 'active'));
      btns.appendChild(restoreBtn);
    }

    const delBtn = document.createElement('button');
    delBtn.type = 'button';
    delBtn.className = 'danger';
    delBtn.textContent = 'حذف';
    delBtn.addEventListener('click', () => deleteReminder(r.id));
    btns.appendChild(delBtn);

    item.appendChild(prio);
    item.appendChild(body);
    item.appendChild(btns);
    list.appendChild(item);
  });

  return list;
}

      nameTd.className = 'habit-name';
      const nameTxt = document.createElement('span');
      nameTxt.className = 'habit-name-txt';
      nameTxt.contentEditable = 'true';
      nameTxt.textContent = h.text;
      nameTxt.addEventListener('blur', () => editHabit(h.id, nameTxt.textContent));
      nameTxt.addEventListener('keydown', (e) => { if(e.key==='Enter'){ e.preventDefault(); nameTxt.blur(); } });
      nameTd.appendChild(nameTxt);
      tr.appendChild(nameTd);

      DAYS.forEach(d => {
        const td = document.createElement('td');
        const on = !!(state.habitDone[h.id] && state.habitDone[h.id][d.key]);
        const chk = document.createElement('div');
        chk.className = 'habit-check' + (on ? ' on' : '');
        chk.addEventListener('click', () => toggleHabit(h.id, d.key));
        td.appendChild(chk);
        tr.appendChild(td);
      });

      const delTd = document.createElement('td');
      const delBtn = document.createElement('button');
      delBtn.className = 'habit-del';
      delBtn.type = 'button';
      delBtn.textContent = '×';
      delBtn.setAttribute('aria-label','حذف عادت');
      delBtn.addEventListener('click', () => deleteHabit(h.id));
      delTd.appendChild(delBtn);
      tr.appendChild(delTd);

      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    scroll.appendChild(table);
    box.appendChild(scroll);
  }

  const addRow = document.createElement('div');
  addRow.className = 'add-habit-row';
  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = 'عادت جدید...';
  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ addHabit(input.value); input.value=''; }
  });
  const addBtn = document.createElement('button');
  addBtn.type = 'button';
  addBtn.textContent = '+';
  addBtn.addEventListener('click', () => { addHabit(input.value); input.value=''; input.focus(); });
  addRow.appendChild(input);
  addRow.appendChild(addBtn);
  box.appendChild(addRow);

  return box;
}

function renderBoard(){
  const board = document.createElement('div');
  board.className = 'board';

  DAYS.forEach(day => {
    const tasks = state.days[day.key];
    const doneCount = tasks.filter(t=>t.done).length;

    const card = document.createElement('div');
    card.className = 'day';
    card.style.setProperty('--dc', day.color);

    const tab = document.createElement('div');
    tab.className = 'tab';
    tab.innerHTML = `<span class="name">${day.name}</span><span class="count">${doneCount}/${tasks.length}</span>`;
    card.appendChild(tab);

    const list = document.createElement('div');
    list.className = 'tasks';

    if(tasks.length === 0){
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'کاری ثبت نشده';
      list.appendChild(empty);
    }

    tasks.forEach(t => {
      const row = document.createElement('div');
      row.className = 'task' + (t.done ? ' done' : '');

      const box = document.createElement('div');
      box.className = 'box';
      box.addEventListener('click', () => toggleTask(day.key, t.id));

      const txt = document.createElement('div');
      txt.className = 'txt';
      txt.contentEditable = 'true';
      txt.textContent = t.text;
      txt.addEventListener('blur', () => editTask(day.key, t.id, txt.textContent));
      txt.addEventListener('keydown', (e) => {
        if(e.key === 'Enter'){ e.preventDefault(); txt.blur(); }
      });

      const del = document.createElement('button');
      del.className = 'del';
      del.type = 'button';
      del.setAttribute('aria-label','حذف');
      del.textContent = '×';
      del.addEventListener('click', () => deleteTask(day.key, t.id));

      row.appendChild(box);
      row.appendChild(txt);
      row.appendChild(del);
      list.appendChild(row);
    });

    card.appendChild(list);

    const addrow = document.createElement('div');
    addrow.className = 'addrow';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'کار جدید...';
    input.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){
        addTask(day.key, input.value);
        input.value = '';
      }
    });
    const addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.textContent = '+';
    addBtn.addEventListener('click', () => {
      addTask(day.key, input.value);
      input.value = '';
      input.focus();
    });
    addrow.appendChild(input);
    addrow.appendChild(addBtn);
    card.appendChild(addrow);

    board.appendChild(card);
  });

  return board;
}

function render(){
  const root = document.getElementById('root');
  root.innerHTML = '';
  root.appendChild(renderReminders());
  root.appendChild(renderIdeas());
  root.appendChild(renderHabits());
  root.appendChild(renderBoard());

  const { total, done } = computeOverall();
  document.getElementById('overall').innerHTML =
    total === 0
      ? 'هنوز کاری اضافه نکردی'
      : `<b>${done} از ${total}</b> کار انجام شده`;
}

document.getElementById('resetBtn').addEventListener('click', async () => {
  if(!confirm('همه‌ی کارها و عادت‌های ثبت‌شده پاک بشه؟')) return;
  state = emptyState();
  await save();
  render();
});

load();

/* ---------- add-to-home-screen handling ---------- */
(function(){
  const bar = document.getElementById('installBar');
  const msg = document.getElementById('installMsg');
  const btn = document.getElementById('installBtn');
  const closeBtn = document.getElementById('installClose');

  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if(isStandalone) return; // already installed, nothing to show

  const isIOS = /iphone|ipad|ipod/i.test(window.navigator.userAgent);
  let deferredPrompt = null;

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    bar.style.display = 'flex';
  });

  if(isIOS){
    msg.textContent = 'برای نصب: دکمه اشتراک‌گذاری Safari رو بزن و «Add to Home Screen» رو انتخاب کن';
    btn.style.display = 'none';
    bar.style.display = 'flex';
  }

  btn.addEventListener('click', async () => {
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    bar.style.display = 'none';
  });

  closeBtn.addEventListener('click', () => { bar.style.display = 'none'; });
})();
</script>
